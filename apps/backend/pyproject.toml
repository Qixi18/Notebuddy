[project]
name = "notebook-backend"
version = "0.1.0"
description = "Local backend for the NoteBuddy learning notebook prototype"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.9",
    "python-pptx>=1.0.2",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.34.0",
    "alembic>=1.20.0",
    "pypdf>=6.19.0",
    "pypdfium2>=5.14,<6",
    "pymupdf>=1.26,<2",
    "fonttools>=4,<5",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
paddleocr = ["paddleocr>=3.7,<4"]
rapidocr = ["rapidocr-onnxruntime>=1.4,<2"]
mineru = ["mineru>=4.0,<5"]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008", "BLE001"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
