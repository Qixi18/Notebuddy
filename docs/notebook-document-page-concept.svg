  <rect x="1491" y="20" width="77" height="34" rx="8" fill="#f1f5f0"/>
  <text x="1529" y="42" text-anchor="middle" font-size="13" class="green">更多</text>

  <rect x="0" y="74" width="320" height="926" fill="#fbfcfa"/>
  <path d="M319.5 74v926" class="line"/>
  <text x="30" y="117" font-size="12" font-weight="700" letter-spacing="1.2" class="muted">资料与目录</text>
  <rect x="24" y="139" width="272" height="52" rx="10" fill="#2f5d45"/>
  <path d="M45 165h16m-8-8v16" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text x="75" y="171" font-size="16" fill="#fff" font-weight="650">上传资料</text>
  <path d="M24 219.5h272" class="line"/>
  <path d="M31 249l5 5 5-5" fill="none" stroke="#6e8874" stroke-width="1.6" stroke-linecap="round"/>
  <text x="49" y="254" font-size="13" class="muted">课程资料</text>
  <rect x="24" y="270" width="272" height="62" rx="9" fill="#f0f5ef"/>
  <rect x="39" y="287" width="24" height="28" rx="4" fill="#d8e8d8"/>
  <path d="M46 294h10m-10 5h10m-10 5h7" stroke="#56825f" stroke-width="1.2" stroke-linecap="round"/>
  <text x="74" y="295" font-size="13" font-weight="600">第一讲 · 极限与连续.pdf</text>
  <text x="74" y="315" font-size="11" class="muted">已整理为笔记 · 12 页</text>
  <path d="M24 359.5h272" class="line"/>
  <path d="M31 389l5 5 5-5" fill="none" stroke="#6e8874" stroke-width="1.6" stroke-linecap="round"/>
  <text x="49" y="394" font-size="13" class="muted">笔记目录</text>
  <text x="296" y="394" text-anchor="end" font-size="11" class="muted">随标题更新</text>
  <path d="M34 421l5 5 5-5" fill="none" stroke="#60806b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="55" y="429" font-size="15" font-weight="650">第一讲 · 极限与连续</text>
  <rect x="24" y="447" width="272" height="41" rx="7" fill="#eaf2e9"/>
  <rect x="24" y="447" width="3" height="41" rx="1.5" fill="#2f5d45"/>
  <text x="53" y="473" font-size="13" font-weight="650" class="green">1. 极限的直观理解</text>
  <text x="53" y="518" font-size="13" fill="#647569">2. 函数极限的定义</text>
  <text x="53" y="562" font-size="13" fill="#647569">3. 连续与间断点</text>
  <path d="M34 606l5 5 5-5" fill="none" stroke="#60806b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="55" y="614" font-size="15" font-weight="650">第二讲 · 导数</text>
  <text x="53" y="659" font-size="13" fill="#647569">1. 导数与变化率</text>
  <text x="53" y="703" font-size="13" fill="#647569">2. 求导法则</text>
  <rect x="360" y="99" width="1187" height="857" rx="14" fill="#fff" filter="url(#shadow)"/>
  <text x="426" y="141" font-size="12" class="muted">课程笔记</text>
  <path d="M501 133l4 4-4 4" fill="none" stroke="#9ba99e" stroke-width="1.5"/>
  <text x="519" y="141" font-size="12" class="muted">数学分析（上）</text>
  <path d="M615 133l4 4-4 4" fill="none" stroke="#9ba99e" stroke-width="1.5"/>
  <text x="633" y="141" font-size="12" class="muted">一元微积分</text>
  <text x="1479" y="141" text-anchor="end" font-size="12" class="muted">点击正文即可编辑</text>
  <path d="M426 164h1055" class="line"/>
  <text x="515" y="238" font-size="39" font-weight="700" class="serif">一元微积分</text>
  <text x="515" y="272" font-size="13" class="muted">课程笔记  ·  2 讲  ·  最近更新于今天 14:32</text>
  <rect x="515" y="305" width="880" height="64" rx="9" fill="#f1f6f0"/>
  <rect x="515" y="305" width="3" height="64" rx="1.5" fill="#6c9a72"/>
  <text x="535" y="331" font-size="13" font-weight="650" class="green">本讲提要</text>
  <text x="535" y="354" font-size="14" fill="#526d58">从变化趋势理解极限，再用极限描述函数在某点附近的行为。</text>
  <text x="515" y="424" font-size="28" font-weight="700" class="serif">第一讲 · 极限与连续</text>
  <path d="M515 445h880" class="line"/>
  <text x="515" y="495" font-size="22" font-weight="700" class="serif">1. 极限的直观理解</text>
  <text x="515" y="537" font-size="16">当自变量逐渐接近某个值时，我们关心函数值会靠近哪里。</text>
  <text x="515" y="568" font-size="16">这种“趋近”关系，就是理解极限的起点。</text>
  <rect x="515" y="597" width="880" height="113" rx="9" fill="#f8faf7" stroke="#e6ece5"/>
  <text x="539" y="629" font-size="13" class="muted">例子</text>
  <text x="539" y="664" font-size="20" fill="#2f5d45" font-family="Georgia,serif">x → 2 时，f(x) = x² 逐渐接近 4</text>
  <text x="539" y="692" font-size="13" class="muted">这里讨论的是接近过程，而不只是在 x = 2 时的取值。</text>
  <text x="515" y="771" font-size="22" font-weight="700" class="serif">2. 函数极限的定义</text>
  <text x="515" y="811" font-size="16">随着距离越来越小，函数值与目标值之间的误差也可以任意缩小。</text>
  <path d="M515 856h880" class="line"/>
  <text x="515" y="887" font-size="12" class="muted">正文中的标题变化会同步到左侧目录。</text>
  <rect x="1451" y="281" width="5" height="440" rx="2.5" fill="#e7ede6"/>
  <rect x="1451" y="281" width="5" height="117" rx="2.5" fill="#a8baaa"/>
</svg>
