    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#20382b" flood-opacity=".07"/></filter>
    <style>
      text { font-family: 'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; fill: #24322a; }
      .muted { fill: #829087; } .green { fill: #2f5d45; } .line { stroke: #e5ebe5; }
      .serif { font-family: 'KaiTi','STKaiti','Songti SC',serif; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f7f9f6"/>
